name: Publish Python Package

# Публикация на PyPI через Trusted Publishing (OIDC) — секреты и токены не нужны.
#
# Разовая настройка на стороне PyPI (Account → Publishing → Add a new pending publisher):
#   PyPI Project Name: remnactual
#   Owner:             IceOne-i
#   Repository name:   remnactual
#   Workflow name:     upload.yml
#   Environment name:  pypi
#
# Релиз: обновить version в pyproject.toml, закоммитить, затем повесить на коммит
# тег vX.Y.Z и запушить его. Всё остальное делает workflow: проверяет, что тег
# совпадает с version, гоняет тесты, собирает, публикует на PyPI и создаёт
# GitHub Release. Пуш в ветку без тега публикацию НЕ запускает.
#
#   git commit -am "chore: release 3.0.1"
#   git tag v3.0.1 && git push origin production --follow-tags

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Check that the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          tag="${GITHUB_REF_NAME#v}"
          echo "pyproject version: $version | tag: $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      - name: Run the offline test suite
        run: |
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio pytest-mock python-dotenv pytz
          python -m pytest -p no:cacheprovider -q \
            tests/test_3_0_compliance.py tests/test_models_validation.py \
            tests/test_enums.py tests/test_controllers_completeness.py

      - name: Build distributions
        run: python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # Релиз создаётся только для тега и только после успешной публикации на PyPI.
    needs: publish-pypi
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            dist/*
