name: Publish Python Package

# Публикация на PyPI через Trusted Publishing (OIDC) — секреты и токены не нужны.
#
# Разовая настройка на стороне PyPI (Account → Publishing → Add a new pending publisher):
#   PyPI Project Name: remnactual
#   Owner:             IceOne-i
#   Repository name:   remnactual
#   Workflow name:     upload.yml
#   Environment name:  pypi
#
# Релиз: обновить version в pyproject.toml, затем создать GitHub Release с тегом
# vX.Y.Z (тег обязан совпадать с version — workflow это проверяет).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Check that the tag matches the project version
        if: github.event_name == 'release'
        run: |
          version="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          tag="${GITHUB_REF_NAME#v}"
          echo "pyproject version: $version | tag: $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      - name: Run the offline test suite
        run: |
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio pytest-mock python-dotenv pytz
          python -m pytest -p no:cacheprovider -q \
            tests/test_3_0_compliance.py tests/test_models_validation.py \
            tests/test_enums.py tests/test_controllers_completeness.py

      - name: Build distributions
        run: python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
