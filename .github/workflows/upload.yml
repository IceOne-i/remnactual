name: Publish Python Package

# ОТКЛЮЧЕНО. Форк не владеет проектом `remnawave` на PyPI, поэтому автопубликация
# при пуше в production невозможна. Запускается только вручную.
# Чтобы включить обратно: вернуть блок
#   push:
#     branches:
#       - production
# и убедиться, что `name` в pyproject.toml указывает на проект PyPI,
# к которому у репозитория есть права публикации.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write
  
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: ${{ !contains(github.event.head_commit.message, '[skip publish]') }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Pull latest changes
        if: ${{ !contains(github.event.head_commit.message, '[skip publish]') }}
        run: git pull origin production --tags --force

      - name: Set up Python
        if: ${{ !contains(github.event.head_commit.message, '[skip publish]') }}
        uses: actions/setup-python@v3
        with:
          python-version: '3.x'

      - name: Install dependencies
        if: ${{ !contains(github.event.head_commit.message, '[skip publish]') }}
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build package
        if: ${{ !contains(github.event.head_commit.message, '[skip publish]') }}
        run: python -m build

      - name: Publish package
        if: ${{ !contains(github.event.head_commit.message, '[skip publish]') }}
        uses: pypa/gh-action-pypi-publish@v1.12.4