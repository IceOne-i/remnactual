[project]
name = "remnactual"
dynamic = ["version"]
description = "A Python SDK for interacting with the Remnawave API v3.x."
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "rapid-api-client==0.10.0",
    "orjson>=3.12.0,<4.0.0",
    "httpx>=0.28.1,<0.29.0",
    "pydantic[email]>=2.13.5,<3.0.0",
    "cryptography>=50.0.1,<51.0.0",
]
keywords = ["remnawave", "api", "sdk", "proxy", "httpx", "async", "xray"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Framework :: AsyncIO",
]

[project.urls]
Homepage = "https://github.com/IceOne-i/remnactual"
"Upstream project" = "https://github.com/remnawave/python-sdk"
"Panel Page" = "https://remna.st/"
"API Documentation" = "https://docs.rw/api"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    "python-dotenv>=1.2.3",
    "pytz>=2026.3.post1",
    "ruff>=0.16.7",
    "twine>=7.0.0",
]

[tool.pytest.ini_options]
addopts = [ "-n", "logical", "-ra", "--strict-config", "--strict-markers" ]
testpaths = ["tests"]
log_cli_level = "INFO"
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.version]
# Единственный источник версии — git-тег (vX.Y.Z или X.Y.Z)
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["remnawave"]

[tool.hatch.build.targets.sdist]
include = ["remnawave", "tests", "README.md", "LICENSE"]

[build-system]
requires = ["hatchling>=1.32.0", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"
